<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stellar Cellar</title>
<style>
:root{
  --bg:#faf7f2;--card:#fff;--ink:#2b2420;--muted:#6f655e;--line:#e6ddd3;--wine:#7b1e3a;--wine-soft:#f6e6ea;
  --ok:#2e7d32;--warn:#c77700;--bad:#b3261e;--grey:#8a8a8a;--gold:#b8860b;
  --fs:17px;--fs-sub:15px;--fs-badge:12px;--fs-h:17px;--fs-title:20px;--nav-h:60px;--scale:1
}
@media(prefers-color-scheme:dark){:root{--bg:#1a1614;--card:#241f1c;--ink:#f2ebe4;--muted:#b3a79e;--line:#3a322d;--wine:#d6557a;--wine-soft:#3a2229}}
html[data-size="large"]{--fs:22px;--fs-sub:19px;--fs-badge:15px;--fs-h:22px;--fs-title:26px;--nav-h:76px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs);line-height:1.35;background:var(--bg);color:var(--ink)}
:root.unframed body{padding-top:env(safe-area-inset-top)}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--wine);color:#fff;font-weight:600;min-height:48px}
button.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
button.big{width:100%;font-size:calc(var(--fs) * 1.1);padding:16px}
button:disabled{opacity:.6}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0 12px;min-height:48px}
label{font-size:var(--fs-sub);color:var(--muted)}
h2{font-size:var(--fs-h);font-weight:700;margin:22px 0 10px;color:var(--ink)}
h2 .sub{font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{min-width:0;flex:1}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:var(--fs-sub)}
.meta{color:var(--muted);font-size:var(--fs-sub);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.meta b{color:var(--ink)}
.badge{font-size:var(--fs-badge);font-weight:700;padding:5px 10px;border-radius:999px;color:#fff;white-space:nowrap;flex:none}
.ready{background:var(--ok)}.drink_soon{background:var(--warn)}.past_peak{background:var(--bad)}.too_young,.unknown{background:var(--grey)}.opened,.gifted{background:var(--grey)}
.score{font-size:var(--fs-badge);font-weight:700;padding:5px 10px;border-radius:8px;color:#fff;white-space:nowrap;flex:none}
.s90{background:var(--gold)}.s80{background:var(--ok)}.s70{background:var(--grey)}.s0{background:var(--bad)}.sv{background:var(--wine)}
.tap{cursor:pointer}
.tap:active{background:var(--wine-soft)}
.empty{color:var(--muted);text-align:center;padding:22px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:var(--fs-sub)}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:500;min-height:40px}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.summary{display:flex;gap:10px}
.summary .card{flex:1;text-align:center;margin:0;padding:12px 6px}
.summary .n{font-size:calc(var(--fs) * 1.6);font-weight:700}
.hero{background:linear-gradient(135deg,var(--wine),#4a1226);color:#fff;border:0;padding:18px}
.hero .eyebrow{opacity:.85;font-size:var(--fs-sub);margin-bottom:4px}
.hero .big{font-size:var(--fs-title);font-weight:700;line-height:1.2}
.hero .where{opacity:.9;margin:6px 0 14px;font-size:var(--fs-sub)}
.hero button{background:#fff;color:var(--wine)}
.hero button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.segs{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin:8px 0 14px}
.segs button{flex:1;background:transparent;color:var(--muted);padding:10px;min-height:42px;border-radius:9px}
.segs button.on{background:var(--wine);color:#fff}
/* top bar */
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 8px 6px;max-width:760px;margin:0 auto}
#top .tbtn{background:transparent;color:var(--wine);padding:8px 10px;font-size:var(--fs);font-weight:600;min-width:48px;min-height:44px}
#top .ttl{flex:1;text-align:center;font-weight:700;font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .spacer{min-width:48px}
main{padding:6px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:calc(var(--fs-sub) * .9);font-weight:500}
nav a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--wine);font-weight:700}
nav a.on svg{stroke-width:2.4}
nav a.scan span.ring{width:46px;height:46px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center}
nav a.scan.on span.ring{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--wine)}
nav a.scan svg{stroke:#fff}
/* sheet + toast */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;z-index:21;display:none;max-width:760px;margin:0 auto}
#sheet h3{margin:0 0 12px;font-size:var(--fs)}
#sheet .opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);margin-bottom:8px;padding:14px;border-radius:12px;font-weight:500}
#sheet .opt small{color:var(--muted);display:block;font-weight:400;font-size:var(--fs-sub)}
.bcard .hd{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.bcard .dot{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#fff4 0,#0000 45%),var(--bc,#7b1e3a);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.bcard .nm{font-size:var(--fs-title);font-weight:700;line-height:1.2}
.bcard .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.bcard .fact{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bcard .fact .k{font-size:calc(var(--fs-sub) * .85);color:var(--muted)}
.bcard .fact .v{font-weight:700;margin-top:2px}
.bcard .tabs{display:flex;gap:6px;margin:0 0 12px}
.bcard .tabs button{flex:1;min-height:38px;padding:6px;border-radius:10px;background:var(--bg);color:var(--muted);border:1.5px solid var(--line);font-weight:600}
.bcard .tabs button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.bcard .sec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bcard .sec button{min-height:44px;padding:10px;font-size:var(--fs-sub)}
.worldmap{width:100%;display:block;border-radius:16px;background:linear-gradient(180deg,#dfe8ee,#cfdbe4);border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.worldmap{background:linear-gradient(180deg,#1c2630,#151c24)}}
.worldmap .land{fill:#f6f1e7;stroke:#c9bfae;stroke-width:1.2;stroke-linejoin:round}
@media(prefers-color-scheme:dark){.worldmap .land{fill:#3a332d;stroke:#5a5048}}
.worldmap .pin{stroke:#fff;stroke-width:3;cursor:pointer}
.worldmap .pin.focus{stroke:var(--gold);stroke-width:6}
.worldmap .halo{fill:none;stroke:var(--gold);stroke-width:4;opacity:.7}
.detailmap{width:100%;display:block;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.detailmap .parent{fill:#efe6d6;stroke:#b9a989;stroke-width:1.5}
.detailmap .sub{fill:#f7f1e6;stroke:#b9a989;stroke-width:1;cursor:pointer}
.detailmap .sub.own{fill:#e8c9cf}
.detailmap .sub.hit{fill:var(--wine);fill-opacity:.85;stroke:var(--gold);stroke-width:2.5}
.detailmap text{font-size:17px;fill:#5a4a3a;pointer-events:none;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3px}
.detailmap text.hit{fill:#fff;stroke:var(--wine)}
@media(prefers-color-scheme:dark){.detailmap .parent{fill:#3a322c;stroke:#6a5a48}.detailmap .sub{fill:#2e2824;stroke:#6a5a48}.detailmap .sub.own{fill:#5a3440}.detailmap text{fill:#e9dccb;stroke:#1a1614}}
.mapchips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px}
.mapchips .chip{white-space:nowrap}
#toast{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;display:none;z-index:9;overflow:hidden}
#toast .trow{display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast button{background:var(--bg);color:var(--ink);padding:8px 14px;min-height:40px}
#toast .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--wine);width:100%;transform-origin:left}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* scan */
.scanwrap{position:relative;background:#000;border-radius:16px;overflow:hidden;min-height:52vh}
video{width:100%;height:52vh;object-fit:cover;display:block}
.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.guide div{width:min(62vw,260px);height:min(62vw,260px);border:3px solid rgba(255,255,255,.85);border-radius:18px}
.banner{background:var(--warn);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.banner button{background:#fff;color:var(--warn);padding:8px 14px;min-height:40px}
/* fridge */
.fridge{position:relative;max-width:420px;margin:0 auto 14px;perspective:1400px}
.fridge .body{background:linear-gradient(180deg,#d9dadd,#b9bbc0 8%,#9a9ca2 92%,#7d7f85);border-radius:14px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.fridge .inner{background:linear-gradient(180deg,#1d1b1c,#141314 55%,#0f0e0f);border-radius:8px;padding:12px 10px 14px;min-height:200px;box-shadow:inset 0 0 50px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.08)}
.fridge .rack{display:grid;gap:5px;margin:7px 0;padding:7px 6px 9px;position:relative;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(233,217,186,.07) 10px 13px),linear-gradient(180deg,transparent 0,transparent 76%,#e8d9b8 76%,#cdb88e 88%,#9c8458 100%);border-radius:3px}
.fridge .ctrl{margin:10px 2px 4px;height:26px;border-radius:5px;background:linear-gradient(180deg,#2a2a2c,#111);display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.fridge .ctrl span{color:#9fd8ff;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-shadow:0 0 6px rgba(159,216,255,.8)}
.fridge .ctrl b{color:#e9e9e9;font-size:10px;letter-spacing:.02em;font-weight:600;opacity:.85}
.fridge .rack.hit{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,.0)}50%{box-shadow:0 0 18px 4px rgba(184,134,11,.55)}}
.fridge .rack .lbl{position:absolute;left:-2px;top:-6px;background:#8a5a35;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:0 6px 6px 0}
.fridge .slot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.fridge .slot.fizz{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),inset 0 0 0 4px rgba(201,162,39,.55)}
.fridge .slot.filled{border:0;background:radial-gradient(circle at 35% 35%,#fff3 0,#0000 40%),var(--bc,#7b1e3a)}
.fridge .slot.back{opacity:.72;transform:scale(.82)}
.fridge .slot.hit{outline:3px solid var(--gold);outline-offset:3px;animation:glow 1.2s ease-in-out infinite;opacity:1;transform:none;z-index:2}
.fridge .slot .star{position:absolute;top:-4px;right:-4px;font-size:10px;color:var(--gold)}
.fridge .rack.cols{display:flex;justify-content:space-evenly;gap:0;padding:6px 4px 12px}
.fridge .cell{position:relative;width:var(--s);height:calc(var(--s) + var(--peek) * (var(--deep) - 1));cursor:pointer;flex:none}
.fridge .cell .slot{position:absolute;left:0;width:var(--s);height:var(--s)}
.fridge .cell .slot.d0{bottom:0;z-index:3}
.fridge .cell .slot.d1{bottom:var(--peek);z-index:2;transform:scale(.86);opacity:.8}
.fridge .cell .slot.d2{bottom:calc(var(--peek) * 2);z-index:1;transform:scale(.74);opacity:.65}
.fridge .cell .slot.hit{opacity:1;z-index:5}
.fridge .cell:active .slot.d0{filter:brightness(1.35)}
.fridge .rack.cols .lbl{left:2px;top:auto;bottom:1px;background:none;color:#6b5634;font-size:13px;padding:0 4px;z-index:6}
.fridge .slot.tap:active{filter:brightness(1.4)}
.fridge .zone{color:#e9d9c3;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin:10px 2px 2px;display:flex;align-items:center;gap:8px}
.fridge .zone::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#c9a46a,transparent)}
.fridge .rack.bulk{grid-template-columns:1fr !important;padding:12px 10px 14px}
.fridge .rack.bulk .pile{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.fridge .rack.bulk .pile .slot{width:22px;height:22px;aspect-ratio:auto}
.fridge .door{position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,#e2e3e6,#b4b6bb 45%,#d2d4d8);transform-origin:left center;transition:transform .9s cubic-bezier(.4,.1,.2,1),opacity .25s ease .85s;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer}
.fridge .door .glass{position:absolute;inset:14px;border-radius:8px;background:linear-gradient(165deg,rgba(40,46,58,.9),rgba(12,14,18,.95) 60%),repeating-linear-gradient(180deg,transparent 0 44px,rgba(233,217,186,.28) 44px 48px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.fridge .door .handle{position:absolute;left:4px;top:min(18%,120px);height:min(40%,260px);width:10px;border-radius:5px;background:linear-gradient(90deg,#f0f0f0,#8c8e93);box-shadow:2px 0 6px rgba(0,0,0,.35)}
.fridge .door{align-items:flex-start}
.fridge .door .name{position:absolute;top:min(22%,170px);left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:var(--fs-title);text-shadow:0 2px 8px rgba(0,0,0,.7);z-index:2}
.fridge .door .hint{position:absolute;top:calc(min(22%,170px) + 2.2em);left:0;right:0;text-align:center;color:#fff;opacity:.85;font-size:var(--fs-sub);z-index:2}
.fridge.open .door{transform:rotateY(-112deg);opacity:0;pointer-events:none}
.fridge.closing .door{transition:opacity .12s ease,transform .45s cubic-bezier(.4,.1,.2,1) .05s;opacity:1;transform:none}
.fridge .cap{color:#fff;opacity:.8;font-size:var(--fs-sub);text-align:center;margin-top:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:var(--fs-sub);color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* wide screens: left rail, two columns */
@media(min-width:700px){
  :root{--fs:20px;--fs-sub:17px;--fs-badge:14px;--fs-h:20px;--fs-title:24px}
  body{padding-left:120px}
  nav{top:0;bottom:0;left:0;right:auto;width:120px;height:auto;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 8px;border-top:0;border-right:1px solid var(--line)}
  nav a{flex:none;padding:14px 0;border-radius:12px;width:100%}
  nav a.on{background:var(--wine-soft)}
  nav a svg{width:30px;height:30px}
  main{max-width:1100px;padding-bottom:30px}
  #top{max-width:1100px}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
  .two > div{min-width:0}
  nav a.scan.hidewide{display:none}
}
:root.unframed nav{padding-top:calc(18px + env(safe-area-inset-top))}
@media (max-width:699px){:root.unframed nav{padding-top:0}}
</style>

<body>
<script>try { if (window.top === window.self) document.documentElement.classList.add('unframed'); } catch (_) { /* cross-origin parent: framed */ }</script>
<div id="top"></div>
<main id="view"></main>
<nav>
  <a href="#/tonight" data-tab="tonight"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Home</a>
  <a href="#/cellar" data-tab="cellar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>Cellar</a>
  <a href="#/scan" class="scan hidewide" data-tab="scan"><span class="ring"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/></svg></span>Scan</a>
  <a href="#/journal" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M8 4v16M18 8h2v12h-2"/></svg>Journal</a>
</nav>
<div id="sheetBg" onclick="closeSheet()"></div><div id="sheet"></div>
<div id="toast"><div class="trow"><span id="toastText"></span><button id="toastBtn"></button></div><div class="bar" id="toastBar"></div></div>

<script src="static/jsQR.js"></script>
<script>
// ---------- core helpers (all URLs relative, so the app works under HA Ingress) ----------
const APP_VERSION = '0.18.1';
const api = async (path, opts={}) => {
  const r = await fetch('api/' + path, {headers:{'Content-Type':'application/json'}, ...opts});
  if (r.status === 401 || r.status === 403) { const err = new Error('session'); err.session = true; throw err; }
  if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail || 'Request failed'); }
  return r.json();
};
function sessionEnded(){
  document.getElementById('top').innerHTML = '<span class="spacer"></span><div class="ttl">Stellar Cellar</div><span class="spacer"></span>';
  view.innerHTML = `<div class="card" style="text-align:center;margin-top:30px">
      <div class="title" style="font-size:var(--fs-title);margin-bottom:8px">Your Home Assistant session ended</div>
      <p class="sub">This happens when the app has been open for a long time. Reloading signs you back in; nothing is lost.</p>
      <button class="big" onclick="reloadApp()">Reload Stellar Cellar</button></div>`;
}
function reloadApp(){ try { window.top.location.reload(); } catch (_) { location.reload(); } }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = document.getElementById('view');
const STATUS = {ready:'Ready', drink_soon:'Drink soon', past_peak:'Past peak', too_young:'Wait', unknown:'No window', opened:'Opened', gifted:'Given away'};
const badge = s => `<span class="badge ${esc(s)}">${STATUS[s] || esc(s)}</span>`;
const scoreClass = s => s == null ? 'sv' : s >= 90 ? 's90' : s >= 80 ? 's80' : s >= 70 ? 's70' : 's0';
const scoreTag = (s, v) => s != null ? `<span class="score ${scoreClass(s)}">${s}</span>` : v ? `<span class="score sv">${esc(v)}</span>` : '';
const money = (v, cur) => v == null ? '' : new Intl.NumberFormat(undefined,{style:'currency',currency:cur||'USD',maximumFractionDigits:0}).format(v);
let CUR = 'USD';
if (localStorage.getItem('sc_size') === 'large') document.documentElement.dataset.size = 'large';

let toastTimer;
function toast(text, btnLabel, onClick, ms = 10000){
  const t = document.getElementById('toast'), b = document.getElementById('toastBtn'), bar = document.getElementById('toastBar');
  document.getElementById('toastText').textContent = text;
  b.style.display = btnLabel ? '' : 'none'; b.textContent = btnLabel || '';
  b.onclick = () => { onClick && onClick(); hideToast(); };
  bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = `shrink ${ms}ms linear forwards`;
  t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms);
}
function hideToast(){ document.getElementById('toast').style.display = 'none'; }
async function busy(btn, fn){ if (!btn || btn.disabled) return; const old = btn.textContent; btn.disabled = true; btn.textContent = 'Working…'; try { await fn(); } finally { btn.disabled = false; btn.textContent = old; } }

// ---------- sheet ----------
function openSheet(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('sheet').style.display = 'block'; document.getElementById('sheetBg').style.display = 'block'; }
function closeSheet(){ document.getElementById('sheet').style.display = 'none'; document.getElementById('sheetBg').style.display = 'none'; }
function choose(title, options){
  return new Promise(res => {
    window.__chooseRes = v => { closeSheet(); res(v); }; window.__chooseOpts = options;
    openSheet(`<h3>${esc(title)}</h3>${options.map((o,i) => `<button class="opt" onclick="__chooseRes(__chooseOpts[${i}].value)">${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}<button class="ghost" style="width:100%" onclick="__chooseRes(null)">Cancel</button>`);
  });
}
function askText(title, placeholder){
  return new Promise(res => {
    window.__textRes = () => { const v = document.getElementById('sheetText').value.trim(); closeSheet(); res(v || null); };
    window.__textCancel = () => { closeSheet(); res(null); };
    openSheet(`<h3>${esc(title)}</h3><input id="sheetText" placeholder="${esc(placeholder||'')}" onkeydown="if(event.key==='Enter')__textRes()"><div class="grid2"><button class="ghost" onclick="__textCancel()">Cancel</button><button onclick="__textRes()">Save</button></div>`);
    setTimeout(() => document.getElementById('sheetText').focus(), 50);
  });
}

// ---------- top bar ----------
// History rules: a finished form never stays in history. go() replaces the current screen;
// finishTo() returns to the screen you came from when that's the target, otherwise replaces.
window.__stack = [location.hash || '#/tonight'];
window.__replacing = false;
function replaceHash(hash){ if (location.hash === hash) { route(); return; } window.__replacing = true; location.replace(location.pathname + location.search + hash); }
function go(hash){ replaceHash(hash); }
function finishTo(hash){
  const s = window.__stack;
  if (s.length > 1 && s[s.length - 2] === hash) history.back(); else replaceHash(hash);
}
function goBack(parent){ if (window.__stack.length > 1) history.back(); else replaceHash(parent); }
function topbar(title, {back, action, noGear} = {}){
  const unframed = window.self === window.top && /\/api\/hassio_ingress\//.test(location.pathname);
  const right = action ? `<button class="tbtn" onclick="${action.onclick}" aria-label="${esc(action.label)}">${action.icon}</button>`
              : noGear ? '<span class="spacer"></span>'
              : `<button class="tbtn" onclick="location.hash='#/settings'" aria-label="Settings">⚙︎</button>`;
  document.getElementById('top').innerHTML = (back ? `<button class="tbtn" onclick="goBack('${back}')">‹ Back</button>` : unframed ? `<button class="tbtn" onclick="location.href='/'" aria-label="Home Assistant">⌂ HA</button>` : '<span class="spacer"></span>') + `<div class="ttl">${esc(title)}</div>` + right;
}

// ---------- printing ----------
let PRINTER = null;
async function printerInfo(){ if (PRINTER === null) { try { PRINTER = await api('printer'); } catch (_) { PRINTER = {configured:false}; } } return PRINTER; }
async function printLabels(codes){
  const p = await printerInfo();
  if (!p.configured) { window.open('api/labels?codes=' + codes.join(','), '_blank'); return; }
  const how = await choose(`Print ${codes.length} label${codes.length>1?'s':''}`, [
    {label:'Send to the Zebra', sub: p.online ? 'Printer is online' : 'Printer did not answer; it may be asleep', value:'zebra'},
    {label:'Open a printable sheet', sub:'For any other printer', value:'sheet'}]);
  if (!how) return;
  if (how === 'sheet') { window.open('api/labels?codes=' + codes.join(','), '_blank'); return; }
  try { const r = await api('print', {method:'POST', body: JSON.stringify({codes})}); toast(`Sent ${r.printed} label${r.printed>1?'s':''} to the Zebra.`); }
  catch (e) { toast(e.message, 'Use sheet', () => window.open('api/labels?codes=' + codes.join(','), '_blank')); }
}

// ---------- shared rows ----------
const bottleRow = c => `
  <div class="card tap" onclick="location.hash='#/bottle/${esc(c.code)}'">
    <div class="row"><div class="col">
      <div class="title">${esc(c.label)}${c.count > 1 ? ` <span class="sub">×${c.count}</span>` : ''}</div>
      <div class="meta"><span>${esc(c.location)}</span>${c.price != null ? `<span>${money(c.price, CUR)}</span>` : ''}${c.score != null ? `<span><b>${c.score}</b>${c.taster ? ' ' + esc(c.taster) : ''}</span>` : ''}${c.reserved_for ? `<span class="score sv" style="padding:2px 8px">Held for ${esc(c.reserved_for)}</span>` : ''}</div>
      ${c.reason ? `<div class="sub" style="margin-top:4px">${esc(c.reason)}</div>` : ''}
    </div>${badge(c.status)}</div>
  </div>`;
const section = (title, items, empty) => `<h2>${title}${items.length ? ` <span class="sub">${items.length}</span>` : ''}</h2>` + (items.length ? items.map(bottleRow).join('') : `<div class="card empty">${empty}</div>`);
const collapsed = (title, items, hash, empty) => items.length ? `<div class="card tap row" onclick="location.hash='${hash}'"><div class="title">${title}</div><div class="sub">${items.length} wine${items.length===1?'':'s'} ›</div></div>` : `<div class="card row"><div class="title" style="color:var(--muted)">${title}</div><div class="sub">${empty}</div></div>`;

// ---------- Home ----------
let sugg = {budget:null, occasion:''};
// Phones always come in through the Nabu Casa link, so where you are doesn't matter.
// The one exception is a wall panel: local network, touch screen, wide. Settings can override per device.
const isLocalHost = () => /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|[^.]+\.local$|homeassistant)/i.test(location.hostname);
function isPanel(){
  const o = localStorage.getItem('sc_panel');
  if (o === 'yes') return true;
  if (o === 'no') return false;
  return isLocalHost() && window.matchMedia('(pointer: coarse)').matches && window.matchMedia('(min-width: 700px)').matches;
}
const isWide = () => window.matchMedia('(min-width: 700px)').matches;
function snoozed(key){ const t = Number(localStorage.getItem('sc_snooze_' + key) || 0); return Date.now() < t; }
function snooze(key, hours = 20){ localStorage.setItem('sc_snooze_' + key, String(Date.now() + hours * 3600e3)); route(); }

function needsCard(h){
  // At most one nudge, in priority order.
  if (h.rate && !snoozed('rate_' + h.rate.code)) return `<div class="card" style="border-color:var(--wine)">
      <div class="title">How was the ${esc(h.rate.label)}?</div><div class="sub">Opened ${new Date(h.rate.opened).toLocaleDateString(undefined,{weekday:'long'})}. One tap saves it to the journal.</div>
      <div class="chips" style="margin:10px 0 4px">${[95,90,85,80,70].map(v => `<button class="chip" onclick="quickRate('${esc(h.rate.code)}',${v},this)">${v}</button>`).join('')}</div>
      <div class="row"><a href="#/journal/new/${esc(h.rate.code)}" class="sub" style="color:var(--wine);text-decoration:none;font-weight:600">Add notes instead ›</a><button class="ghost" style="min-height:36px;padding:6px 12px;border:0" onclick="snooze('rate_${esc(h.rate.code)}')">Not now</button></div></div>`;
  if (h.arrivals > 0 && !snoozed('arrivals')) return `<div class="card row"><div class="col"><div class="title">${h.arrivals} bottle${h.arrivals === 1 ? '' : 's'} waiting to be shelved</div><div class="sub">They're in New arrivals. Give each a spot so you can find it.</div></div></div>
      <div class="grid2" style="margin:-4px 0 10px"><button onclick="location.hash='#/location/${esc(h.holding_code)}'">Shelve them</button><button class="ghost" onclick="snooze('arrivals')">Not now</button></div>`;
  if (h.incoming > 0 && !snoozed('incoming')) return `<div class="card tap row" onclick="location.hash='#/cellar'"><div class="col"><div class="title">${h.incoming} bottle${h.incoming === 1 ? '' : 's'} on order</div><div class="sub">Did any arrive? Mark them in Cellar → On order.</div></div><button class="ghost" style="min-height:36px;padding:6px 12px;border:0" onclick="event.stopPropagation();snooze('incoming', 72)">Not now</button></div>`;
  if (h.drink_soon > 0 && !snoozed('soon')) return `<div class="card tap row" onclick="location.hash='#/list/drink_soon'"><div class="col"><div class="title">${h.drink_soon} bottle${h.drink_soon === 1 ? '' : 's'} closing their window</div><div class="sub">Worth opening in the next few months.</div></div><span class="sub">›</span></div>`;
  return '';
}
async function quickRate(code, score, el){
  el.parentElement.querySelectorAll('.chip').forEach(c => c.disabled = true);
  try { const b = await api('bottle/' + code); await api('journal', {method:'POST', body: JSON.stringify({wine: [b.producer, b.name].filter(Boolean).join(' '), vintage: b.vintage, score, bottle_code: code})}); toast(`Saved ${score} for ${b.label}.`); route(); }
  catch (e) { toast(e.message); }
}

let hs;
function homeSearch(){
  clearTimeout(hs);
  hs = setTimeout(async () => {
    const q = document.getElementById('hq').value.trim(), box = document.getElementById('hres');
    if (!q) { box.innerHTML = ''; return; }
    const [bottles, journal] = await Promise.all([api('search?q=' + encodeURIComponent(q)), api('journal?q=' + encodeURIComponent(q))]);
    const groups = {}; bottles.forEach(c => { (groups[c.label] = groups[c.label] || {...c, count:0}).count++; });
    const owned = Object.values(groups);
    box.innerHTML = (owned.length ? `<h2>In your cellar <span class="sub">${bottles.length}</span></h2>${owned.map(bottleRow).join('')}` : '')
      + (journal.length ? `<h2>In the journal <span class="sub">${journal.length}</span></h2>${journal.slice(0, 6).map(t => `<div class="card row"><div class="col"><div class="title">${esc(t.wine)}${t.vintage ? ' ' + t.vintage : ''}</div><div class="sub">${esc(t.taster || '')}${t.notes ? ' · ' + esc(t.notes) : ''}</div></div>${scoreTag(t.score, t.verdict || 'tasted')}</div>`).join('')}` : '')
      || '<div class="card empty">Nothing in the cellar or journal matches.</div>';
  }, 250);
}

async function tonight(){
  const [p, h] = await Promise.all([api('picks'), api('home')]);
  CUR = p.currency;
  const hero = p.under_high[0] || p.special[0] || p.under_low[0] || p.use_soon[0];
  const evening = new Date().getHours() >= 15;
  const panel = isPanel();
  topbar('Home');
  const search = `<input id="hq" placeholder="Find a bottle or wine" oninput="homeSearch()" autocomplete="off"><div id="hres"></div>`;
  const wlInput = `<input type="file" id="wlHome" accept="image/*" capture="environment" style="display:none" onchange="startWineList(this.files[0])"><input type="file" id="wlLib" accept="image/*" style="display:none" onchange="startWineList(this.files[0])">`;
  const outCard = panel ? '' : `<button class="big" style="margin:2px 0 4px;display:flex;align-items:center;justify-content:center;gap:10px" onclick="wlHome.click()">📷 In the Streets? Show me the wine list</button><div style="text-align:center;margin:0 0 12px"><a href="javascript:void(0)" onclick="wlLib.click()" class="sub" style="color:var(--wine);font-weight:600;text-decoration:none">or choose a photo you already took</a></div>`;
  const heroHtml = hero ? `
    <div class="card hero">
      <div class="eyebrow">${evening ? "Tonight we'd open" : 'Ready to open'}</div>
      <div class="big">${esc(hero.label)}</div>
      <div class="where">${esc(hero.location)}${hero.slot ? ' · ' + esc(hero.slot) : ''}${hero.price != null ? ' · ' + money(hero.price, CUR) : ''}${hero.score != null ? ' · ' + hero.score + ' points' : ''}</div>
      <div class="grid2"><button onclick="location.hash='#/bottle/${esc(hero.code)}'">Open this</button><button class="ghost" onclick="${hero.location_code ? `location.hash='#/location/${esc(hero.location_code)}/find/${esc(hero.code)}'` : `document.getElementById('food').focus()`}">${hero.location_code ? 'Show me where' : 'Something else'}</button></div>
    </div>` : h.total === 0 ? `<div class="card hero"><div class="big">Welcome to your cellar</div><div class="where">Add your first bottle: tap Scan and photograph the label.</div><button onclick="location.hash='#/add'">Add a bottle</button></div>` : '';
  const ask = `<div class="card">
      <input id="food" placeholder="What are we eating?">
      <div class="chips">${[['Any budget',null],['Under ' + money(p.thresholds.low,CUR), p.thresholds.low],['Under ' + money(p.thresholds.high,CUR), p.thresholds.high]].map(([l,v]) => `<button class="chip ${sugg.budget===v?'on':''}" onclick="setBudget(${v===null?'null':v}, this)">${l}</button>`).join('')}</div>
      <div class="chips">${['Weeknight','Guests','Special'].map(o => `<button class="chip ${sugg.occasion===o?'on':''}" onclick="setOcc('${o}', this)">${o}</button>`).join('')}</div>
      <button class="big" id="suggestBtn" onclick="recommend()">Suggest something else</button>
      <div id="recs"></div></div>`;
  const actions = panel ? `<button class="ghost" style="width:100%;margin:4px 0 12px" onclick="location.hash='#/add'">＋ Add a bottle</button>` : `<div class="grid3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px">
      <button class="ghost" onclick="location.hash='#/scan'">📷<br><span style="font-size:var(--fs-sub)">Scan</span></button>
      <button class="ghost" onclick="location.hash='#/add'">＋<br><span style="font-size:var(--fs-sub)">Add a bottle</span></button>
      <button class="ghost" onclick="location.hash='#/out'">🏷️<br><span style="font-size:var(--fs-sub)">Check a bottle</span></button></div>`;
  const glance = h.fridge ? `<div class="card tap row" onclick="location.hash='#/location/${esc(h.fridge.code)}'"><div class="col"><div class="title">${esc(h.fridge.name)}</div><div class="meta"><span>${h.fridge.count}${h.fridge.capacity ? ' of ' + h.fridge.capacity : ''} bottles</span><span>${h.fridge.ready} ready</span>${h.drink_soon ? `<span>${h.drink_soon} drink soon</span>` : ''}</div></div><span class="sub">›</span></div>` : '';
  const budgets = `<h2>By budget</h2>
    ${section('Under ' + money(p.thresholds.low,CUR), p.under_low, 'No priced bottles in this range are ready.')}
    ${section('Under ' + money(p.thresholds.high,CUR), p.under_high, 'No priced bottles in this range are ready.')}
    ${section('Special occasion', p.special, 'Mark a wine as special, or add one over ' + money(p.thresholds.high,CUR) + '.')}
    <h2>Later</h2>
    ${collapsed('Use soon', p.use_soon, '#/list/drink_soon', 'nothing closing')}
    ${collapsed('Waiting to come of age', p.hold, '#/list/too_young', 'nothing waiting')}`;
  // Order is fixed; only the evening/morning swap moves things. Panels drop the camera actions.
  const main = [
    panel ? '' : wlInput,
    search,
    outCard,
    needsCard(h),
    evening ? heroHtml + ask + actions : actions + heroHtml + ask,
    isWide() ? '' : glance,
    budgets,
  ].join('');
  if ((panel || isWide()) && h.fridge && h.fridge.laid_out) {
    // Panels: the fridge is the hero on the left, everything else on the right.
    const loc = await api('location/' + h.fridge.code);
    view.innerHTML = `<div class="two"><div><h2 style="margin-top:6px">${esc(loc.name)} <span class="sub">${h.fridge.count} of ${h.fridge.capacity} · ${h.fridge.ready} ready</span></h2>${renderFridge(loc, {})}</div><div>${main}</div></div>`;
    document.getElementById('fridge')?.classList.add('open');
  } else {
    view.innerHTML = main;
  }
}

let WL = {image: null, budget: Number(localStorage.getItem('sc_wl_budget')) || null, food: ''};
async function startWineList(file){
  if (!file) return;
  toast('Reading the wine list…');
  WL.image = await downsize(file, 2200);
  WL.food = '';
  if (location.hash === '#/out/list') wineListPage(); else location.hash = '#/out/list';
}
function wineListPage(){
  topbar('Wine list', {back:'#/tonight', noGear:true});
  if (!WL.image) { view.innerHTML = `<input type="file" id="wlAgain" accept="image/*" capture="environment" style="display:none" onchange="startWineList(this.files[0])"><div class="card empty">No photo yet.<br><br><button onclick="wlAgain.click()">📷 Photo the wine list</button></div>`; return; }
  const budgets = [['Any', null], ['Under $75', 75], ['Under $100', 100], ['Under $150', 150]];
  view.innerHTML = `
    <input type="file" id="wlAgain" accept="image/*" capture="environment" style="display:none" onchange="startWineList(this.files[0])">
    <div id="outRes"><div class="card empty">Reading the list…</div></div>
    <h2>Fine-tune</h2>
    <div class="card">
      <div class="chips" id="wlBudget">${budgets.map(([l, v]) => `<button class="chip ${WL.budget === v ? 'on' : ''}" onclick="WL.budget=${v === null ? 'null' : v};localStorage.setItem('sc_wl_budget', ${v === null ? "''" : v});runWineList()">${l}</button>`).join('')}</div>
      <div class="chips">${['Steak','Fish','Pasta','Chicken','Pizza','Cheese'].map(f => `<button class="chip ${WL.food === f ? 'on' : ''}" onclick="WL.food=WL.food==='${f}'?'':'${f}';runWineList()">${f}</button>`).join('')}</div>
      <input id="wlFood" placeholder="Or type the dish" value="${esc(WL.food)}" onchange="WL.food=this.value;runWineList()">
    </div>
    <input type="file" id="wlLib2" accept="image/*" style="display:none" onchange="startWineList(this.files[0])">
    <div class="grid2"><button class="ghost" onclick="wlAgain.click()">📷 Retake</button><button class="ghost" onclick="wlLib2.click()">Choose a photo</button></div>`;
  runWineList();
}
async function runWineList(){
  if (document.getElementById('wlBudget')) {
    document.querySelectorAll('#wlBudget .chip').forEach(c => c.classList.toggle('on', c.textContent === (WL.budget ? 'Under $' + WL.budget : 'Any')));
  }
  return readWineList();
}
async function readWineList(){
  const box = document.getElementById('outRes'); if (!box || !WL.image) return;
  box.innerHTML = `<div class="card empty">Reading the list${WL.food ? ' for ' + esc(WL.food.toLowerCase()) : ''}${WL.budget ? ', under $' + WL.budget : ''}…</div>`;
  try {
    const image = WL.image;
    const r = await api('winelist', {method:'POST', body: JSON.stringify({image, media_type:'image/jpeg', food: WL.food, budget_max: WL.budget})});
    if (r.unreadable && !r.picks.length) { box.innerHTML = '<div class="card empty">Couldn\'t read that list. Try again closer, flat, and with good light.</div>'; return; }
    box.innerHTML = `<h2>Picks</h2>${r.summary ? `<p>${esc(r.summary)}</p>` : ''}
      ${r.picks.map((x, i) => `<div class="card"><div class="row"><div class="col"><div class="title">${i + 1}. ${esc(x.line)}</div><div class="meta"><span><b>${esc(x.price)}</b></span>${x.journal ? `<span>Journal: ${esc(x.journal)}</span>` : ''}${x.owned ? '<span>You own this at home</span>' : ''}</div><div style="margin-top:6px">${esc(x.reason)}</div></div></div>
        <button class="ghost" style="width:100%;margin-top:8px;min-height:40px" onclick="sessionStorage.setItem('prefillWine', ${esc(JSON.stringify(x.line)).replace(/"/g,'&quot;')});location.hash='#/journal/new'">We ordered this: rate it</button></div>`).join('')}
      ${r.avoid.length ? `<h2>Skip</h2>${r.avoid.map(a => `<div class="card"><div class="title">${esc(a.line)}</div><div class="sub">${esc(a.reason)}</div></div>`).join('')}` : ''}`;
  } catch (e) { if (e.session) return sessionEnded(); box.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}
async function checkBottle(file){
  if (!file) return;
  const box = document.getElementById('outRes'); box.innerHTML = '<div class="card empty">Reading the label…</div>';
  try {
    const image = await downsize(file);
    const d = await api('scan-label', {method:'POST', body: JSON.stringify({image, media_type:'image/jpeg'})});
    const name = [d.producer, d.name].filter(Boolean).join(' ');
    const q = d.producer || name;
    const [owned, journal] = await Promise.all([api('search?q=' + encodeURIComponent(q)), api('journal?q=' + encodeURIComponent(q))]);
    const best = journal.find(t => t.score != null);
    const verdict = best ? (best.score >= 90 ? 'You loved this one' : best.score >= 80 ? 'You liked it' : best.score >= 70 ? 'It was just OK' : 'You didn\'t like it') : (journal.find(t => t.verdict === 'dislike') ? 'You didn\'t like it' : journal.length ? 'You\'ve had it' : 'New to you');
    box.innerHTML = `<div class="card"><div class="title" style="font-size:var(--fs-title)">${esc(name)}${d.vintage ? ' ' + d.vintage : ''}</div><div class="sub">${esc([d.region, d.country].filter(Boolean).join(', '))}${d.varietals.length ? ' · ' + esc(d.varietals.join(', ')) : ''}</div>
      <div class="meta" style="margin:10px 0"><span><b>${verdict}</b></span>${best ? scoreTag(best.score) : ''}${owned.length ? `<span>${owned.length} at home</span>` : ''}</div>
      ${journal.slice(0, 3).map(t => `<div class="sub">${esc(t.wine)}${t.vintage ? ' ' + t.vintage : ''}${t.score != null ? ' · ' + t.score : ''}${t.notes ? ' · ' + esc(t.notes) : ''}</div>`).join('')}
      <div class="grid2" style="margin-top:12px"><button class="ghost" onclick="addWishFrom(${esc(JSON.stringify(name + (d.vintage ? ' ' + d.vintage : ''))).replace(/"/g,'&quot;')})">Add to wish list</button><button class="ghost" onclick="sessionStorage.setItem('prefillWine', ${esc(JSON.stringify(name)).replace(/"/g,'&quot;')});location.hash='#/journal/new'">Rate it</button></div></div>`;
  } catch (e) { if (e.session) return sessionEnded(); box.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}

async function downsize(file, maxEdge = 1600){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
async function readLabel(file, msgId){
  document.getElementById(msgId).textContent = 'Reading the label…';
  const image = await downsize(file);
  return api('scan-label', {method:'POST', body: JSON.stringify({image, media_type:'image/jpeg'})});
}
async function scanLabelFile(file){

    if (d.varietals.length) bits.push('Grapes: ' + d.varietals.join(', '));
    if (d.drink_from || d.drink_to) bits.push('Drinking window is an AI estimate.');
    if (d.note) bits.push(d.note);
    msg.innerHTML = bits.map(esc).join('<br>');

}

async function pickPerson(title, people, preset){
  const opts = [...(preset ? [{label: preset, sub:'held for', value: preset}] : []), ...people.filter(p => p !== preset).map(p => ({label: p, value: p})), {label:'Someone else…', value:'__new'}];

async function bottleMenu(){
  const b = window.__bottle, code = window.__bottleCode; if (!b) return;
  const inCellar = b.bottle_status === 'in_cellar', incoming = b.bottle_status === 'incoming';
  const opts = [];
  if (inCellar) opts.push({label:'Move to another place', value:'move'});
  const places = await api('locations');
  const here = places.find(l => l.code === b.location_code);
  const racked = places.filter(l => l.capacity);
  if (inCellar && here && here.capacity) opts.push({label: b.slot ? `Change the slot (now ${b.slot})` : 'Set the slot', value:'slot'});
  else if (inCellar) racked.forEach(f => opts.push({label: `Put it in the ${f.name}`, sub: 'Tap the spot it sits in', value: 'into:' + f.code}));
  if ((inCellar || incoming) && !b.reserved_for) opts.push({label:'Hold for someone', sub:'Keeps it out of Tonight and suggestions', value:'hold'});
  if (inCellar || incoming) opts.push({label:'Print label', value:'print'});
  opts.push({label:'Edit details', sub:`Bottle code ${code}`, value:'edit'});
  if (inCellar) opts.push({label:'Delete…', sub:'For mistakes. Use Drink for bottles you opened.', value:'delete'});
  const pick = await choose(b.label, opts);
  if (pick === 'move') moveBottle(code);
  else if (pick === 'slot') placeInFridge(code, b.location_code);
  else if (pick && String(pick).startsWith('into:')) placeInFridge(code, String(pick).slice(5));
  else if (pick === 'hold') holdBottle(code);
  else if (pick === 'print') printLabels([code]);
  else if (pick === 'edit') location.hash = '#/edit/' + code;
  else if (pick === 'delete') {
    if (b.siblings_in_cellar > 1) {
      const which = await choose('Delete which?', [{label:'Just this bottle', value:'one'}, {label:`All ${b.siblings_in_cellar} bottles of this wine`, value:'all'}]);
      if (which === 'one') deleteBottle(code); else if (which === 'all') deleteAll(b.wine_id, b.siblings_in_cellar);
    } else deleteBottle(code);
  }
}

// One tap target per column. Placing: pick front/back when the rack is two deep. Browsing: open the bottle, or choose if two.
async function cellTapped(rack, pos, deep, placing){
  const slots = window.__fridgeSlots || {};
  const layers = Array.from({length: deep}, (_, d) => ({d, id: slotId(rack, pos, d), b: slots[slotId(rack, pos, d)]}));
  if (placing) {
    let id = layers[0].id;
    if (deep > 1) {
      id = await choose(`Rack ${rack}, position ${pos}`, layers.map(l => ({label: l.d === 0 ? 'Front' : l.d === 1 ? 'Back' : 'Far back', sub: l.b ? `Now: ${l.b.label}` : 'Empty', value: l.id})));
      if (!id) return;
    }
    const occupant = slots[id];
    if (occupant && occupant.code !== placingCode) {
      const ok = await choose(`Replace the ${occupant.label} at ${id}?`, [
        {label: 'Replace it', sub: `It moves to "Slot not recorded" on this fridge`, value: true}]);
      if (!ok) return;
    }
    return slotTapped(id);
  }
  const where = d => deep === 1 ? '' : d === 0 ? 'front' : d === 1 ? 'back' : 'far back';
  if (layers.some(l => l.b)) return bottleCard(rack, pos, deep, layers.find(l => l.b).d);
  const opts = layers.map(l => l.b
    ? {label: l.b.label, sub: deep > 1 ? `Open · ${where(l.d)}` : 'Open', value: 'open:' + l.b.code}
    : {label: deep > 1 ? `Add wine to the ${where(l.d)}` : 'Add wine here', sub: 'Pick from New arrivals or add a new bottle', value: 'fill:' + l.id});
  let pick = opts.length === 1 ? opts[0].value : await choose(`Rack ${rack}, position ${pos}`, opts);
  if (!pick) return;
  const [kind, val] = [pick.slice(0, pick.indexOf(':')), pick.slice(pick.indexOf(':') + 1)];
  const [, , locCode] = location.hash.split('/');
  if (kind === 'open') location.hash = '#/bottle/' + val;
  else location.hash = `#/location/${locCode}/fill/${val}`;
}

      ${tabs}

          <div class="meta" style="margin-top:6px">${badge(b.status)}${b.reserved_for ? `<span class="score sv" style="padding:4px 10px">Held for ${esc(b.reserved_for)}</span>` : ''}${b.siblings_in_cellar > 1 ? `<span>${b.siblings_in_cellar} bottles of this wine</span>` : ''}</div></div></div>

      ${b.journal.find(j => j.notes) ? `<p class="sub" style="margin:-4px 0 12px">“${esc(b.journal.find(j => j.notes).notes)}”</p>` : ''}
      ${b.bottle_status === 'in_cellar' ? `<button class="big" onclick="closeSheet();drink('${esc(b.code)}', ${b.reserved_for ? `'${esc(b.reserved_for)}'` : 'null'})">Drink this</button>` : ''}
      <div class="sec">${sec.join('')}</div>

async function swapDepth(code, locCode, fromId, toId){
  const occupant = (window.__fridgeSlots || {})[toId];
  try {
    await api(`bottle/${code}/slot`, {method:'POST', body: JSON.stringify({location_code: locCode, slot: toId})});
    if (occupant) await api(`bottle/${occupant.code}/slot`, {method:'POST', body: JSON.stringify({location_code: locCode, slot: fromId})});
    closeSheet(); toast(occupant ? 'Swapped front and back.' : `Moved to ${toId}.`); go('#/location/' + locCode + '/find/' + code);
  } catch (e) { toast(e.message); }
}

async function fillPage(locCode, slot){
  const [l, all, locs] = await Promise.all([api('location/' + locCode), api('bottles'), api('locations')]);
  const holding = (locs.find(x => x.holding) || {}).code;
  const candidates = all.filter(b => !(b.location_code === locCode && b.slot));
  const groups = [];
  const onRack = candidates.filter(b => b.location_code === locCode);
  if (onRack.length) groups.push(['On this fridge, slot not recorded', onRack]);
  const arrivals = candidates.filter(b => b.location_code === holding);
  if (arrivals.length) groups.push(['New arrivals', arrivals]);
  const byPlace = {};
  candidates.filter(b => b.location_code !== locCode && b.location_code !== holding).forEach(b => (byPlace[b.location] = byPlace[b.location] || []).push(b));
  Object.entries(byPlace).forEach(g => groups.push(g));
  window.__fillGroups = groups;
  topbar('Add wine to ' + slot, {back:'#/location/' + locCode, noGear:true});
  const dedupe = list => { const g = {}; list.forEach(b => { (g[b.label] = g[b.label] || {...b, count:0, codes:[]}); g[b.label].count++; g[b.label].codes.push(b.code); }); return Object.values(g); };
  const row = b => `<div class="card tap" onclick="fillWith('${esc(b.codes[0])}','${esc(locCode)}','${esc(slot)}')"><div class="row"><div class="col"><div class="title">${esc(b.label)}${b.count > 1 ? ` <span class="sub">×${b.count}</span>` : ''}</div><div class="meta"><span>${esc(b.location)}</span>${b.price != null ? `<span>${money(b.price, CUR)}</span>` : ''}${b.score != null ? `<span><b>${b.score}</b></span>` : ''}${b.reserved_for ? `<span class="score sv" style="padding:2px 8px">Held for ${esc(b.reserved_for)}</span>` : ''}</div></div>${badge(b.status)}</div></div>`;
  const render = q => {
    const term = (q || '').trim().toLowerCase();

      const shown = dedupe(list.filter(b => !term || b.label.toLowerCase().includes(term)));
      return shown.length ? `<h2>${esc(name)} <span class="sub">${list.length}</span></h2>${shown.map(row).join('')}` : '';
    }).join('') || `<div class="card empty">${term ? 'No bottles match.' : 'Every bottle already has a spot.'}</div>`;
  };
  view.innerHTML = `
    <button class="big" onclick="sessionStorage.setItem('addTo','${esc(locCode)}');sessionStorage.setItem('addSlot','${esc(slot)}');location.hash='#/add'">📷 Add a new bottle here</button>
    <input id="fillQ" placeholder="Search your bottles" style="margin-top:12px">
    <div id="fillList">${render('')}</div>`;
  document.getElementById('fillQ').oninput = e => { document.getElementById('fillList').innerHTML = render(e.target.value); };
}

// ---------- Scan ----------
let stream, scanning;
async function scan(){
  const moveTo = sessionStorage.getItem('moveTo');
  let moveName = '';
  if (moveTo) { try { moveName = (await api('location/' + moveTo)).name; } catch (_) { sessionStorage.removeItem('moveTo'); } }
  topbar(moveTo ? 'Moving bottles' : 'Scan', moveTo ? {back:'#/location/' + moveTo, noGear:true} : {noGear:true});
  view.innerHTML = `
    ${moveTo ? `<div class="banner"><div>Moving to ${esc(moveName)}<div class="sub" style="color:#fff;opacity:.9" id="moveCount">${sessionStorage.getItem('moveCount')||0} scanned</div></div><button onclick="endMove()">Done</button></div>` : '<p class="sub">Point at a bottle or place label.</p>'}
    <div class="scanwrap"><video id="cam" autoplay playsinline muted></video><div class="guide"><div></div></div></div>
    <div id="camMsg" class="sub" style="margin:8px 0"></div>
    <div id="camDiag" class="sub" style="font-size:11px;opacity:.7"></div>
    <input type="file" id="qrPhoto" accept="image/*" capture="environment" style="display:none" onchange="decodeQrPhoto(this.files[0])">
    <button class="big" id="qrPhotoBtn" style="margin-top:8px" onclick="qrPhoto.click()">📷 Take a photo of the QR</button>
    <input type="file" id="labelFile" accept="image/*" capture="environment" style="display:none" onchange="pendingLabelFile=this.files[0];location.hash='#/add'">
    <div class="grid2" style="margin-top:8px"><button class="ghost" onclick="labelFile.click()">Read a wine label</button><button class="ghost" onclick="typeCode()">Type a code</button></div>`;
  const msg = document.getElementById('camMsg');
  const diag = s => { const d = document.getElementById('camDiag'); if (d) d.textContent = `v${APP_VERSION} · ${window.self === window.top ? 'full page' : 'in HA frame'} · ${s}`; };
  diag(navigator.mediaDevices?.getUserMedia ? 'camera API present, requesting…' : 'no camera API in this view');
  if (!navigator.mediaDevices?.getUserMedia) { document.querySelector('.scanwrap').style.display = 'none'; msg.textContent = 'Live camera not available here. Use "Take a photo of the QR" below; it works the same.'; return; }
  try {
    const req = navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const timer = new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), {name:'NoResponse'})), 8000));
    stream = await Promise.race([req, timer]);
    diag('camera granted, live');
    const v = document.getElementById('cam'); v.srcObject = stream;
    scanning = true; let last = '', lastAt = 0;
    const onValue = async raw => {
      const m = raw.match(/\/q\/([A-Z0-9]+)/i) || raw.match(/^([BL][A-Z0-9]{6})$/i);
      if (m && (m[1] !== last || Date.now() - lastAt > 3000)) { last = m[1]; lastAt = Date.now(); if (navigator.vibrate) navigator.vibrate(60); await handleCode(m[1]); }
    };
    // Native detector where the browser has one (Chrome on Android); jsQR everywhere else (Safari, the HA app).
    const native = ('BarcodeDetector' in window) ? new BarcodeDetector({formats:['qr_code']}) : null;
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', {willReadFrequently:true});
    let busyFrame = false, frame = 0;
    const loop = async () => {
      if (!scanning) return;
      if (!busyFrame && v.readyState >= 2 && (frame++ % 3 === 0)) {
        busyFrame = true;
        try {
          if (native) { for (const c of await native.detect(v)) await onValue(c.rawValue); }
          else if (window.jsQR) {
            const scale = Math.min(1, 640 / v.videoWidth); canvas.width = Math.round(v.videoWidth * scale); canvas.height = Math.round(v.videoHeight * scale);
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const r = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
            if (r && r.data) await onValue(r.data);
          }
        } catch (_) {}
        busyFrame = false;
      }
      requestAnimationFrame(loop);
    };
    v.onloadedmetadata = () => { v.play().catch(()=>{}); loop(); };
    msg.textContent = native ? '' : '';
  } catch (e) {
    diag('camera refused: ' + (e.name || 'error') + (e.message ? ' ' + e.message.slice(0,60) : ''));
    document.querySelector('.scanwrap').style.display = 'none';
    const framed = window.self !== window.top;
    msg.innerHTML = `Live camera not available here (${esc(e.name || 'error')}).`
      + (framed ? ` Home Assistant's frame blocks it. <button class="big" style="margin-top:10px" onclick="window.open(location.href, '_top')">Open full screen for live scanning</button><div class="sub" style="margin-top:6px">Or use "Take a photo of the QR" below.</div>` : ' Allow camera access for this app, or use "Take a photo of the QR" below.');
  }
}
async function decodeQrPhoto(file){
  if (!file) return;
  const msg = document.getElementById('camMsg'); msg.textContent = 'Reading the QR…';
  try {
    const bmp = await createImageBitmap(file);
    // try a few sizes; small labels in a big photo need the full resolution, big ones decode faster small
    for (const maxEdge of [1000, 1800, 2600]) {
      const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      const ctx = c.getContext('2d', {willReadFrequently:true}); ctx.drawImage(bmp, 0, 0, c.width, c.height);
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const r = window.jsQR ? jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'}) : null;
      if (r && r.data) { msg.textContent = ''; if (navigator.vibrate) navigator.vibrate(60); await handleCode(r.data); return; }
      if (scale === 1) break;
    }
    msg.textContent = 'No QR found in that photo. Get closer so the code fills about a third of the frame, and try again.';
  } catch (e) { msg.textContent = 'Could not read the photo: ' + e.message; }
}
async function typeCode(){ const c = await askText('Type the code on the label', 'B7K3QX9 or L4M9TQ2'); if (c) handleCode(c); }
function stopScan(){ scanning = false; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function handleCode(raw){
  const code = (raw || '').trim().toUpperCase().replace(/.*\/Q\//, ''); if (!code) return;
  const moveTo = sessionStorage.getItem('moveTo');
  if (moveTo && code.startsWith('B')) {
    try { const r = await api(`bottle/${code}/move`, {method:'POST', body: JSON.stringify({location_code: moveTo})}); const n = Number(sessionStorage.getItem('moveCount')||0) + 1; sessionStorage.setItem('moveCount', n); const mc = document.getElementById('moveCount'); if (mc) mc.textContent = n + ' scanned'; toast(`Moved to ${r.location}.`, null, null, 2500); } catch (e) { toast(e.message); }
    return;
  }
  stopScan();
  go(code.startsWith('L') ? '#/location/' + code : '#/bottle/' + code);
}

      <div class="segs"><button class="${large?'':'on'}" onclick="setSize('normal')">Normal</button><button class="${large?'on':''}" onclick="setSize('large')">Large</button></div>
      <label>Default place for new bottles</label>
      <select id="defLoc">${ls.map(l => `<option value="${l.code}" ${l.code === st.default_location_code ? 'selected' : ''}>${esc(l.name)}${l.holding ? ' (holding place)' : ''}</option>`).join('')}</select>
      <label>Default taster for journal entries</label><input id="defTaster" value="${esc(st.default_taster || '')}" placeholder="Jen">
      <label>Household taste profile (Claude reads this when recommending)</label><textarea id="tasteProfile" rows="8">${esc(st.taste_profile || '')}</textarea>
      <button class="big" onclick="saveSettings()">Save</button></div>
    <h2>Label printer</h2>
    <div class="card" id="printerCard">Checking…</div>
    <p class="sub" style="text-align:center">Stellar Cellar v${APP_VERSION}</p>
    <h2>From the add-on configuration</h2>
    <div class="card sub">Currency ${esc(st.currency)} · Drink soon within ${st.drink_soon_months} months · Price tiers ${money(st.price_tier_low, st.currency)} and ${money(st.price_tier_high, st.currency)}<br>Change these in Home Assistant: Settings → Add-ons → Stellar Cellar → Configuration.</div>`;
  loadPrinterCard();
}
async function loadPrinterCard(){
  const p = await printerInfo(); const el = document.getElementById('printerCard'); if (!el) return;
  el.innerHTML = p.configured ? `<div class="row"><div><div class="title">Zebra at ${esc(p.host)}</div><div class="sub">${p.online ? 'Online' : 'Not answering'} · ${p.label_mm[0]} × ${p.label_mm[1]} mm · ${p.dpi} dpi</div></div><button class="ghost" onclick="testPrint(this)">Test print</button></div>`
    : '<div class="sub">No network printer set. Add the Zebra\'s IP as zebra_host in the add-on configuration and labels will print straight from your phone.</div>';
}
async function testPrint(btn){ await busy(btn, async () => { try { await api('print/test', {method:'POST'}); toast('Test label sent.'); } catch (e) { toast(e.message); } }); }
function setPanel(v){ if (v === 'auto') localStorage.removeItem('sc_panel'); else localStorage.setItem('sc_panel', v); settings(); }
function setSize(s){ if (s === 'large') { document.documentElement.dataset.size = 'large'; localStorage.setItem('sc_size','large'); } else { delete document.documentElement.dataset.size; localStorage.removeItem('sc_size'); } settings(); }
async function saveSettings(){
  await api('settings', {method:'POST', body: JSON.stringify({default_location_code: document.getElementById('defLoc').value, default_taster: document.getElementById('defTaster').value, taste_profile: document.getElementById('tasteProfile').value})});
  toast('Settings saved.');
}

// ---------- Router ----------
const TAB_FOR = {windows:'cellar', out:'tonight', home:'tonight', map:'cellar', regions:'cellar', list:'tonight', tonight:'tonight', cellar:'cellar', bottle:'cellar', edit:'cellar', held:'cellar', gifts:'cellar', location:'cellar', add:'cellar', scan:'scan', journal:'journal', settings:''};
window.addEventListener('hashchange', () => {
  const s = window.__stack, cur = location.hash || '#/tonight';
  if (window.__replacing) { s[s.length - 1] = cur; window.__replacing = false; }
  else if (s.length > 1 && s[s.length - 2] === cur) s.pop();
  else s.push(cur);
  if (s.length > 50) s.splice(0, s.length - 50);
});
async function route(){
  closeSheet();
  if (!location.hash.startsWith('#/scan')) stopScan();
  const [, page, arg] = location.hash.split('/');
  const tab = TAB_FOR[page] ?? 'tonight';
  document.querySelectorAll('nav a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  window.scrollTo(0, 0);
  const slow = setTimeout(() => { view.innerHTML = page === 'location' ? '<div class="fridge" style="opacity:.35"><div class="body"><div class="inner" style="min-height:60vh"></div></div></div>' : '<div class="card empty">Loading…</div>'; }, 250);
  try {
    if (page === 'scan') await scan();
    else if (page === 'cellar') await cellar();
    else if (page === 'add') addForm();
    else if (page === 'bottle' && arg) await bottle(arg.toUpperCase());
    else if (page === 'location' && arg) { const parts = location.hash.split('/'); await locationPage(arg.toUpperCase(), parts[3], parts[4] ? parts[4].toUpperCase() : null); }
    else if (page === 'settings') await settings();
    else if (page === 'edit' && arg) await editForm(arg.toUpperCase());
    else if (page === 'held') await heldPage();
    else if (page === 'map') await mapPage(arg === 'r' ? location.hash.split('/').slice(3).join('/') : null);
    else if (page === 'regions') await regionsPage();
    else if (page === 'windows') await windowsPage();
    else if (page === 'out' && arg === 'list') wineListPage();
    else if (page === 'out') await outPage();
    else if (page === 'gifts') await giftsPage();
    else if (page === 'list') await statusList(arg || 'all');
    else if (page === 'journal' && arg === 'new') await journalNew(location.hash.split('/')[3] ? location.hash.split('/')[3].toUpperCase() : null);
    else if (page === 'journal') await journal();
    else await tonight();
  } catch (e) { if (e.session) sessionEnded(); else view.innerHTML = `<div class="card empty">${esc(e.message)}<br><br><button class="ghost" onclick="route()">Try again</button></div>`; }
  finally { clearTimeout(slow); }
}
window.addEventListener('hashchange', route);
route();
</script>
