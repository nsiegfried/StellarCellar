<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stellar Cellar</title>
<style>
:root{
  --bg:#faf7f2;--card:#fff;--ink:#2b2420;--muted:#6f655e;--line:#e6ddd3;--wine:#7b1e3a;--wine-soft:#f6e6ea;
  --ok:#2e7d32;--warn:#c77700;--bad:#b3261e;--grey:#8a8a8a;--gold:#b8860b;
  --fs:17px;--fs-sub:15px;--fs-badge:12px;--fs-h:17px;--fs-title:20px;--nav-h:60px;--scale:1
}
@media(prefers-color-scheme:dark){:root{--bg:#1a1614;--card:#241f1c;--ink:#f2ebe4;--muted:#b3a79e;--line:#3a322d;--wine:#d6557a;--wine-soft:#3a2229}}
html[data-size="large"]{--fs:22px;--fs-sub:19px;--fs-badge:15px;--fs-h:22px;--fs-title:26px;--nav-h:76px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs);line-height:1.35;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--wine);color:#fff;font-weight:600;min-height:48px}
button.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
button.big{width:100%;font-size:calc(var(--fs) * 1.1);padding:16px}
button:disabled{opacity:.6}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0 12px;min-height:48px}
label{font-size:var(--fs-sub);color:var(--muted)}
h2{font-size:var(--fs-h);font-weight:700;margin:22px 0 10px;color:var(--ink)}
h2 .sub{font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{min-width:0;flex:1}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:var(--fs-sub)}
.meta{color:var(--muted);font-size:var(--fs-sub);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.meta b{color:var(--ink)}
.badge{font-size:var(--fs-badge);font-weight:700;padding:5px 10px;border-radius:999px;color:#fff;white-space:nowrap;flex:none}
.ready{background:var(--ok)}.drink_soon{background:var(--warn)}.past_peak{background:var(--bad)}.too_young,.unknown{background:var(--grey)}.opened,.gifted{background:var(--grey)}
.score{font-size:var(--fs-badge);font-weight:700;padding:5px 10px;border-radius:8px;color:#fff;white-space:nowrap;flex:none}
.s90{background:var(--gold)}.s80{background:var(--ok)}.s70{background:var(--grey)}.s0{background:var(--bad)}.sv{background:var(--wine)}
.tap{cursor:pointer}
.tap:active{background:var(--wine-soft)}
.empty{color:var(--muted);text-align:center;padding:22px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:var(--fs-sub)}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:500;min-height:40px}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.summary{display:flex;gap:10px}
.summary .card{flex:1;text-align:center;margin:0;padding:12px 6px}
.summary .n{font-size:calc(var(--fs) * 1.6);font-weight:700}
.hero{background:linear-gradient(135deg,var(--wine),#4a1226);color:#fff;border:0;padding:18px}
.hero .eyebrow{opacity:.85;font-size:var(--fs-sub);margin-bottom:4px}
.hero .big{font-size:var(--fs-title);font-weight:700;line-height:1.2}
.hero .where{opacity:.9;margin:6px 0 14px;font-size:var(--fs-sub)}
.hero button{background:#fff;color:var(--wine)}
.hero button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.segs{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin:8px 0 14px}
.segs button{flex:1;background:transparent;color:var(--muted);padding:10px;min-height:42px;border-radius:9px}
.segs button.on{background:var(--wine);color:#fff}
/* top bar */
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 8px 6px;max-width:760px;margin:0 auto}
#top .tbtn{background:transparent;color:var(--wine);padding:8px 10px;font-size:var(--fs);font-weight:600;min-width:48px;min-height:44px}
#top .ttl{flex:1;text-align:center;font-weight:700;font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .spacer{min-width:48px}
main{padding:6px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:calc(var(--fs-sub) * .9);font-weight:500}
nav a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--wine);font-weight:700}
nav a.on svg{stroke-width:2.4}
nav a.scan span.ring{width:46px;height:46px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center}
nav a.scan.on span.ring{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--wine)}
nav a.scan svg{stroke:#fff}
/* sheet + toast */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;z-index:21;display:none;max-width:760px;margin:0 auto}
#sheet h3{margin:0 0 12px;font-size:var(--fs)}
#sheet .opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);margin-bottom:8px;padding:14px;border-radius:12px;font-weight:500}
#sheet .opt small{color:var(--muted);display:block;font-weight:400;font-size:var(--fs-sub)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;display:none;z-index:9;overflow:hidden}
#toast .trow{display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast button{background:var(--bg);color:var(--ink);padding:8px 14px;min-height:40px}
#toast .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--wine);width:100%;transform-origin:left}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* scan */
.scanwrap{position:relative;background:#000;border-radius:16px;overflow:hidden;min-height:52vh}
video{width:100%;height:52vh;object-fit:cover;display:block}
.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.guide div{width:min(62vw,260px);height:min(62vw,260px);border:3px solid rgba(255,255,255,.85);border-radius:18px}
.banner{background:var(--warn);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.banner button{background:#fff;color:var(--warn);padding:8px 14px;min-height:40px}
/* fridge */
.fridge{position:relative;max-width:420px;margin:0 auto 14px;perspective:1400px}
.fridge .body{background:linear-gradient(180deg,#2b2a2e,#141317);border-radius:18px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.fridge .inner{background:radial-gradient(ellipse at 50% 0%,#5a3b2a 0%,#241914 60%,#17110e 100%);border-radius:12px;padding:10px 10px 12px;min-height:200px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.fridge .rack{display:grid;gap:6px;margin:8px 0;padding:8px 6px 10px;background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 78%,#8a5a35 78%,#5a3718 100%);border-radius:4px;position:relative}
.fridge .rack.hit{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,.0)}50%{box-shadow:0 0 18px 4px rgba(184,134,11,.55)}}
.fridge .rack .lbl{position:absolute;left:-2px;top:-6px;background:#8a5a35;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:0 6px 6px 0}
.fridge .slot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.fridge .slot.filled{border:0;background:radial-gradient(circle at 35% 35%,#fff3 0,#0000 40%),var(--bc,#7b1e3a)}
.fridge .slot.back{opacity:.72;transform:scale(.82)}
.fridge .slot.hit{outline:3px solid var(--gold);outline-offset:3px;animation:glow 1.2s ease-in-out infinite;opacity:1;transform:none;z-index:2}
.fridge .slot .star{position:absolute;top:-4px;right:-4px;font-size:10px;color:var(--gold)}
.fridge .slot .n{font-size:9px;color:rgba(255,255,255,.45)}
.fridge .slot.tap:active{filter:brightness(1.4)}
.fridge .door{position:absolute;inset:0;border-radius:18px;background:linear-gradient(135deg,#d8d9dc,#a6a8ad 40%,#c9cbd0);transform-origin:left center;transition:transform .9s cubic-bezier(.4,.1,.2,1);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.fridge .door .glass{position:absolute;inset:18px 18px 18px 18px;border-radius:10px;background:linear-gradient(160deg,rgba(60,70,90,.85),rgba(20,25,35,.92));box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.fridge .door .handle{position:absolute;right:8px;top:30%;bottom:30%;width:6px;border-radius:3px;background:linear-gradient(90deg,#eee,#999)}
.fridge .door .name{position:relative;color:#fff;font-weight:700;font-size:var(--fs-title);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.fridge.open .door{transform:rotateY(-108deg);pointer-events:none}
.fridge .cap{color:#fff;opacity:.8;font-size:var(--fs-sub);text-align:center;margin-top:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:var(--fs-sub);color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* wide screens: left rail, two columns */
@media(min-width:700px){
  :root{--fs:20px;--fs-sub:17px;--fs-badge:14px;--fs-h:20px;--fs-title:24px}
  body{padding-left:120px}
  nav{top:0;bottom:0;left:0;right:auto;width:120px;height:auto;flex-direction:column;justify-content:flex-start;gap:6px;padding:calc(18px + env(safe-area-inset-top)) 8px;border-top:0;border-right:1px solid var(--line)}
  nav a{flex:none;padding:14px 0;border-radius:12px;width:100%}
  nav a.on{background:var(--wine-soft)}
  nav a svg{width:30px;height:30px}
  main{max-width:1100px;padding-bottom:30px}
  #top{max-width:1100px}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
  .two > div{min-width:0}
  nav a.scan.hidewide{display:none}
}
</style>
</head>
<body>
<div id="top"></div>
<main id="view"></main>
<nav>
  <a href="#/tonight" data-tab="tonight"><svg viewBox="0 0 24 24"><path d="M8 3h8l-1 7a3 3 0 0 1-6 0z"/><path d="M12 13v6M8 21h8"/></svg>Tonight</a>
  <a href="#/cellar" data-tab="cellar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>Cellar</a>
  <a href="#/scan" class="scan hidewide" data-tab="scan"><span class="ring"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/></svg></span>Scan</a>
  <a href="#/journal" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M8 4v16M18 8h2v12h-2"/></svg>Journal</a>
</nav>
<div id="sheetBg" onclick="closeSheet()"></div><div id="sheet"></div>
<div id="toast"><div class="trow"><span id="toastText"></span><button id="toastBtn"></button></div><div class="bar" id="toastBar"></div></div>

<script src="static/jsQR.js"></script>
<script>
// ---------- core helpers (all URLs relative, so the app works under HA Ingress) ----------
const APP_VERSION = '0.12.1';
const api = async (path, opts={}) => {
  const r = await fetch('api/' + path, {headers:{'Content-Type':'application/json'}, ...opts});
  if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail || 'Request failed'); }
  return r.json();
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = document.getElementById('view');
const STATUS = {ready:'Ready', drink_soon:'Drink soon', past_peak:'Past peak', too_young:'Wait', unknown:'No window', opened:'Opened', gifted:'Given away'};
const badge = s => `<span class="badge ${esc(s)}">${STATUS[s] || esc(s)}</span>`;
const scoreClass = s => s == null ? 'sv' : s >= 90 ? 's90' : s >= 80 ? 's80' : s >= 70 ? 's70' : 's0';
const scoreTag = (s, v) => s != null ? `<span class="score ${scoreClass(s)}">${s}</span>` : v ? `<span class="score sv">${esc(v)}</span>` : '';
const money = (v, cur) => v == null ? '' : new Intl.NumberFormat(undefined,{style:'currency',currency:cur||'USD',maximumFractionDigits:0}).format(v);
let CUR = 'USD';
if (localStorage.getItem('sc_size') === 'large') document.documentElement.dataset.size = 'large';

let toastTimer;
function toast(text, btnLabel, onClick, ms = 10000){
  const t = document.getElementById('toast'), b = document.getElementById('toastBtn'), bar = document.getElementById('toastBar');
  document.getElementById('toastText').textContent = text;
  b.style.display = btnLabel ? '' : 'none'; b.textContent = btnLabel || '';
  b.onclick = () => { onClick && onClick(); hideToast(); };
  bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = `shrink ${ms}ms linear forwards`;
  t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms);
}
function hideToast(){ document.getElementById('toast').style.display = 'none'; }
async function busy(btn, fn){ if (!btn || btn.disabled) return; const old = btn.textContent; btn.disabled = true; btn.textContent = 'Working…'; try { await fn(); } finally { btn.disabled = false; btn.textContent = old; } }

// ---------- sheet ----------
function openSheet(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('sheet').style.display = 'block'; document.getElementById('sheetBg').style.display = 'block'; }
function closeSheet(){ document.getElementById('sheet').style.display = 'none'; document.getElementById('sheetBg').style.display = 'none'; }
function choose(title, options){
  return new Promise(res => {
    window.__chooseRes = v => { closeSheet(); res(v); }; window.__chooseOpts = options;
    openSheet(`<h3>${esc(title)}</h3>${options.map((o,i) => `<button class="opt" onclick="__chooseRes(__chooseOpts[${i}].value)">${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}<button class="ghost" style="width:100%" onclick="__chooseRes(null)">Cancel</button>`);
  });
}
function askText(title, placeholder){
  return new Promise(res => {
    window.__textRes = () => { const v = document.getElementById('sheetText').value.trim(); closeSheet(); res(v || null); };
    window.__textCancel = () => { closeSheet(); res(null); };
    openSheet(`<h3>${esc(title)}</h3><input id="sheetText" placeholder="${esc(placeholder||'')}" onkeydown="if(event.key==='Enter')__textRes()"><div class="grid2"><button class="ghost" onclick="__textCancel()">Cancel</button><button onclick="__textRes()">Save</button></div>`);
    setTimeout(() => document.getElementById('sheetText').focus(), 50);
  });
}

// ---------- top bar ----------
function goBack(parent){ if (window.__navDepth > 0) { window.__navDepth--; history.back(); } else location.hash = parent; }
function topbar(title, {back, action, noGear} = {}){
  const unframed = window.self === window.top && /\/api\/hassio_ingress\//.test(location.pathname);
  const right = action ? `<button class="tbtn" onclick="${action.onclick}" aria-label="${esc(action.label)}">${action.icon}</button>`
              : noGear ? '<span class="spacer"></span>'
              : `<button class="tbtn" onclick="location.hash='#/settings'" aria-label="Settings">⚙︎</button>`;
  document.getElementById('top').innerHTML = (back ? `<button class="tbtn" onclick="goBack('${back}')">‹ Back</button>` : unframed ? `<button class="tbtn" onclick="location.href='/'" aria-label="Home Assistant">⌂ HA</button>` : '<span class="spacer"></span>') + `<div class="ttl">${esc(title)}</div>` + right;
}

// ---------- printing ----------
let PRINTER = null;
async function printerInfo(){ if (PRINTER === null) { try { PRINTER = await api('printer'); } catch (_) { PRINTER = {configured:false}; } } return PRINTER; }
async function printLabels(codes){
  const p = await printerInfo();
  if (!p.configured) { window.open('api/labels?codes=' + codes.join(','), '_blank'); return; }
  const how = await choose(`Print ${codes.length} label${codes.length>1?'s':''}`, [
    {label:'Send to the Zebra', sub: p.online ? 'Printer is online' : 'Printer did not answer; it may be asleep', value:'zebra'},
    {label:'Open a printable sheet', sub:'For any other printer', value:'sheet'}]);
  if (!how) return;
  if (how === 'sheet') { window.open('api/labels?codes=' + codes.join(','), '_blank'); return; }
  try { const r = await api('print', {method:'POST', body: JSON.stringify({codes})}); toast(`Sent ${r.printed} label${r.printed>1?'s':''} to the Zebra.`); }
  catch (e) { toast(e.message, 'Use sheet', () => window.open('api/labels?codes=' + codes.join(','), '_blank')); }
}

// ---------- shared rows ----------
const bottleRow = c => `
  <div class="card tap" onclick="location.hash='#/bottle/${esc(c.code)}'">
    <div class="row"><div class="col">
      <div class="title">${esc(c.label)}${c.count > 1 ? ` <span class="sub">×${c.count}</span>` : ''}</div>
      <div class="meta"><span>${esc(c.location)}</span>${c.price != null ? `<span>${money(c.price, CUR)}</span>` : ''}${c.score != null ? `<span><b>${c.score}</b>${c.taster ? ' ' + esc(c.taster) : ''}</span>` : ''}${c.reserved_for ? `<span class="score sv" style="padding:2px 8px">Held for ${esc(c.reserved_for)}</span>` : ''}</div>
      ${c.reason ? `<div class="sub" style="margin-top:4px">${esc(c.reason)}</div>` : ''}
    </div>${badge(c.status)}</div>
  </div>`;
const section = (title, items, empty) => `<h2>${title}${items.length ? ` <span class="sub">${items.length}</span>` : ''}</h2>` + (items.length ? items.map(bottleRow).join('') : `<div class="card empty">${empty}</div>`);
const collapsed = (title, items, hash, empty) => items.length ? `<div class="card tap row" onclick="location.hash='${hash}'"><div class="title">${title}</div><div class="sub">${items.length} wine${items.length===1?'':'s'} ›</div></div>` : `<div class="card row"><div class="title" style="color:var(--muted)">${title}</div><div class="sub">${empty}</div></div>`;

// ---------- Tonight ----------
let sugg = {budget:null, occasion:''};
async function tonight(){
  const [p, s] = await Promise.all([api('picks'), api('summary')]);
  CUR = p.currency;
  const hero = p.under_high[0] || p.special[0] || p.under_low[0] || p.use_soon[0];
  topbar('Tonight');
  const heroHtml = hero ? `
    <div class="card hero">
      <div class="eyebrow">Tonight we'd open</div>
      <div class="big">${esc(hero.label)}</div>
      <div class="where">${esc(hero.location)}${hero.price != null ? ' · ' + money(hero.price, CUR) : ''}${hero.score != null ? ' · ' + hero.score + ' points' : ''} · ${STATUS[hero.status]}</div>
      <div class="grid2"><button onclick="location.hash='#/bottle/${esc(hero.code)}'">Open this</button><button class="ghost" onclick="${hero.location_code ? `location.hash='#/location/${esc(hero.location_code)}/find/${esc(hero.code)}'` : `document.getElementById('food').focus()`}">${hero.location_code ? 'Show me where' : 'Something else'}</button></div>
    </div>` : s.total === 0 ? `<div class="card hero"><div class="big">Welcome to your cellar</div><div class="where">Add your first bottle: tap Scan and photograph the label.</div><button onclick="location.hash='#/add'">Add a bottle</button></div>` : '';
  const left = `
    ${heroHtml}
    <div class="summary">
      <div class="card tap" onclick="location.hash='#/list/all'"><div class="n">${s.total}</div><div class="sub">bottles ›</div></div>
      <div class="card tap" onclick="location.hash='#/list/ready'"><div class="n">${s.ready}</div><div class="sub">ready ›</div></div>

async function downsize(file, maxEdge = 1600){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
async function readLabel(file, msgId){
  document.getElementById(msgId).textContent = 'Reading the label…';
  const image = await downsize(file);
  return api('scan-label', {method:'POST', body: JSON.stringify({image, media_type:'image/jpeg'})});
}
async function scanLabelFile(file){
  if (!file) return;
  const msg = document.getElementById('scanMsg');
  try {
    const d = await readLabel(file, 'scanMsg');
    producer.value = d.producer; name.value = d.name; region.value = d.region; color.value = d.color;
    document.getElementById('vintage').value = d.vintage ?? '';
    document.getElementById('from').value = d.drink_from ?? ''; document.getElementById('to').value = d.drink_to ?? '';
    const bits = [`Read with ${d.confidence} confidence. Check the fields, then Save.`];
    if (d.varietals.length) bits.push('Grapes: ' + d.varietals.join(', '));
    if (d.drink_from || d.drink_to) bits.push('Drinking window is an AI estimate.');
    if (d.note) bits.push(d.note);
    msg.innerHTML = bits.map(esc).join('<br>');
  } catch (e) { msg.textContent = e.message; }
}

// ---------- Fridge view ----------
const COLOR = {red:'#7b1e3a', white:'#d9c270', rose:'#e0848f', sparkling:'#c9a227', dessert:'#b06a1c', fortified:'#5a2a4a'};
function slotId(rack, i, d){ return `${rack}-${i}${d === 0 ? '' : 'ABC'[d]}`; }
function renderFridge(loc, {highlightCode, placing, onSlot} = {}){
  const lay = loc.layout; if (!lay) return '';
  const byslot = {}; loc.bottles.forEach(b => { if (b.slot) byslot[b.slot] = b; });
  const unplaced = loc.bottles.filter(b => !b.slot);
  const hitBottle = highlightCode ? loc.bottles.find(b => b.code === highlightCode) : null;
  const hitRack = hitBottle && hitBottle.slot ? hitBottle.slot.split('-')[0] : null;
  const racks = lay.racks.map(r => {
    const rows = [];
    for (let d = r.deep - 1; d >= 0; d--) {            // back row drawn first (smaller), front row last
      for (let i = 1; i <= r.across; i++) {
        const id = slotId(r.name, i, d), b = byslot[id];
        const hit = hitBottle && b && b.code === hitBottle.code;
        const cls = ['slot', b ? 'filled' : '', d > 0 ? 'back' : '', hit ? 'hit' : '', (placing || b) ? 'tap' : ''].join(' ');
        const style = b ? `--bc:${COLOR[b.color] || COLOR.red}` : '';
        const title = b ? esc(b.label) : id;
        const click = placing ? `onclick="${onSlot}('${id}')"` : b ? `onclick="location.hash='#/bottle/${esc(b.code)}'"` : '';
        rows.push(`<div class="${cls}" style="${style};grid-column:${i}" title="${title}" ${click}>${b ? (b.score >= 90 ? '<span class="star">★</span>' : '') : `<span class="n">${i}</span>`}</div>`);
      }
    }
    const rackHit = hitRack === r.name && !(hitBottle && hitBottle.slot.includes('-') && byslot[hitBottle.slot]) ? 'hit' : (hitRack === r.name ? 'hit' : '');
    return `<div class="rack ${hitBottle && !hitBottle.slot ? '' : rackHit}" style="grid-template-columns:repeat(${r.across},1fr)"><span class="lbl">${esc(r.name)}</span>${rows.join('')}</div>`;
  });
  const used = loc.bottles.length, cap = loc.capacity || 0;
  return `<div class="fridge" id="fridge">
      <div class="body"><div class="inner">${racks.join('')}</div>
        <div class="cap">${used} of ${cap} bottles${unplaced.length ? ` · ${unplaced.length} on a rack, slot unknown` : ''}${hitBottle && !hitBottle.slot ? ' · this bottle is in here, slot not recorded' : ''}</div></div>
      <div class="door" onclick="document.getElementById('fridge').classList.add('open')"><div class="glass"></div><div class="handle"></div><div class="name">${esc(loc.name)}</div></div>
    </div>
    <div class="legend"><span><i style="background:${COLOR.red}"></i>Red</span><span><i style="background:${COLOR.white}"></i>White</span><span><i style="background:${COLOR.rose}"></i>Rosé</span><span><i style="background:${COLOR.sparkling}"></i>Sparkling</span><span>★ 90+</span></div>`;
}

// ---------- Scan ----------
let stream, scanning;
async function scan(){
  const moveTo = sessionStorage.getItem('moveTo');
  let moveName = '';
  if (moveTo) { try { moveName = (await api('location/' + moveTo)).name; } catch (_) { sessionStorage.removeItem('moveTo'); } }
  topbar(moveTo ? 'Moving bottles' : 'Scan', moveTo ? {back:'#/location/' + moveTo, noGear:true} : {noGear:true});
  view.innerHTML = `
    ${moveTo ? `<div class="banner"><div>Moving to ${esc(moveName)}<div class="sub" style="color:#fff;opacity:.9" id="moveCount">${sessionStorage.getItem('moveCount')||0} scanned</div></div><button onclick="endMove()">Done</button></div>` : '<p class="sub">Point at a bottle or place label.</p>'}
    <div class="scanwrap"><video id="cam" autoplay playsinline muted></video><div class="guide"><div></div></div></div>
    <div id="camMsg" class="sub" style="margin:8px 0"></div>
    <div id="camDiag" class="sub" style="font-size:11px;opacity:.7"></div>
    <input type="file" id="qrPhoto" accept="image/*" capture="environment" style="display:none" onchange="decodeQrPhoto(this.files[0])">
    <button class="big" id="qrPhotoBtn" style="margin-top:8px" onclick="qrPhoto.click()">📷 Take a photo of the QR</button>
    <input type="file" id="labelFile" accept="image/*" capture="environment" style="display:none" onchange="pendingLabelFile=this.files[0];location.hash='#/add'">
    <div class="grid2" style="margin-top:8px"><button class="ghost" onclick="labelFile.click()">Read a wine label</button><button class="ghost" onclick="typeCode()">Type a code</button></div>`;
  const msg = document.getElementById('camMsg');
  const diag = s => { const d = document.getElementById('camDiag'); if (d) d.textContent = `v${APP_VERSION} · ${window.self === window.top ? 'full page' : 'in HA frame'} · ${s}`; };
  diag(navigator.mediaDevices?.getUserMedia ? 'camera API present, requesting…' : 'no camera API in this view');
  if (!navigator.mediaDevices?.getUserMedia) { document.querySelector('.scanwrap').style.display = 'none'; msg.textContent = 'Live camera not available here. Use "Take a photo of the QR" below; it works the same.'; return; }
  try {
    const req = navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const timer = new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), {name:'NoResponse'})), 8000));
    stream = await Promise.race([req, timer]);
    diag('camera granted, live');
    const v = document.getElementById('cam'); v.srcObject = stream;
    scanning = true; let last = '', lastAt = 0;
    const onValue = async raw => {
      const m = raw.match(/\/q\/([A-Z0-9]+)/i) || raw.match(/^([BL][A-Z0-9]{6})$/i);
      if (m && (m[1] !== last || Date.now() - lastAt > 3000)) { last = m[1]; lastAt = Date.now(); if (navigator.vibrate) navigator.vibrate(60); await handleCode(m[1]); }
    };
    // Native detector where the browser has one (Chrome on Android); jsQR everywhere else (Safari, the HA app).
    const native = ('BarcodeDetector' in window) ? new BarcodeDetector({formats:['qr_code']}) : null;
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', {willReadFrequently:true});
    let busyFrame = false, frame = 0;
    const loop = async () => {
      if (!scanning) return;
      if (!busyFrame && v.readyState >= 2 && (frame++ % 3 === 0)) {
        busyFrame = true;
        try {
          if (native) { for (const c of await native.detect(v)) await onValue(c.rawValue); }
          else if (window.jsQR) {
            const scale = Math.min(1, 640 / v.videoWidth); canvas.width = Math.round(v.videoWidth * scale); canvas.height = Math.round(v.videoHeight * scale);
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const r = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
            if (r && r.data) await onValue(r.data);
          }
        } catch (_) {}
        busyFrame = false;
      }
      requestAnimationFrame(loop);
    };
    v.onloadedmetadata = () => { v.play().catch(()=>{}); loop(); };
    msg.textContent = native ? '' : '';
  } catch (e) {
    diag('camera refused: ' + (e.name || 'error') + (e.message ? ' ' + e.message.slice(0,60) : ''));
    document.querySelector('.scanwrap').style.display = 'none';
    const framed = window.self !== window.top;
    msg.innerHTML = `Live camera not available here (${esc(e.name || 'error')}).`
      + (framed ? ` Home Assistant's frame blocks it. <button class="big" style="margin-top:10px" onclick="window.open(location.href, '_top')">Open full screen for live scanning</button><div class="sub" style="margin-top:6px">Or use "Take a photo of the QR" below.</div>` : ' Allow camera access for this app, or use "Take a photo of the QR" below.');
  }
}
async function decodeQrPhoto(file){
  if (!file) return;
  const msg = document.getElementById('camMsg'); msg.textContent = 'Reading the QR…';
  try {
    const bmp = await createImageBitmap(file);
    // try a few sizes; small labels in a big photo need the full resolution, big ones decode faster small
    for (const maxEdge of [1000, 1800, 2600]) {
      const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      const ctx = c.getContext('2d', {willReadFrequently:true}); ctx.drawImage(bmp, 0, 0, c.width, c.height);
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const r = window.jsQR ? jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'}) : null;
      if (r && r.data) { msg.textContent = ''; if (navigator.vibrate) navigator.vibrate(60); await handleCode(r.data); return; }
      if (scale === 1) break;
    }
    msg.textContent = 'No QR found in that photo. Get closer so the code fills about a third of the frame, and try again.';
  } catch (e) { msg.textContent = 'Could not read the photo: ' + e.message; }
}
async function typeCode(){ const c = await askText('Type the code on the label', 'B7K3QX9 or L4M9TQ2'); if (c) handleCode(c); }
function stopScan(){ scanning = false; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function handleCode(raw){
  const code = (raw || '').trim().toUpperCase().replace(/.*\/Q\//, ''); if (!code) return;
  const moveTo = sessionStorage.getItem('moveTo');
  if (moveTo && code.startsWith('B')) {
    try { const r = await api(`bottle/${code}/move`, {method:'POST', body: JSON.stringify({location_code: moveTo})}); const n = Number(sessionStorage.getItem('moveCount')||0) + 1; sessionStorage.setItem('moveCount', n); const mc = document.getElementById('moveCount'); if (mc) mc.textContent = n + ' scanned'; toast(`Moved to ${r.location}.`, null, null, 2500); } catch (e) { toast(e.message); }
    return;
  }
  stopScan();
  location.hash = code.startsWith('L') ? '#/location/' + code : '#/bottle/' + code;
}

    <label>If unscored</label><select id="tvd"><option value="">—</option><option value="favorite">Favorite</option><option value="ok">OK</option><option value="dislike">Dislike</option></select>
    <label>Notes</label><textarea id="tn" rows="3" placeholder="Smoke, cedar, long finish…"></textarea>
    <label>Where</label><input id="twh" placeholder="Home, restaurant, tasting room…">
    <button class="big" id="tsave" onclick="saveTasting(${code ? `'${esc(code)}'` : 'null'})">Save</button><div id="tmsg" class="sub"></div></div>`;
}
async function saveTasting(code){
  const btn = document.getElementById('tsave'); if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const body = {wine: tw.value, vintage: num('tv'), taster: tt.value, score: num('ts'), verdict: tvd.value, notes: tn.value, where: twh.value, bottle_code: code};
    await api('journal', {method:'POST', body: JSON.stringify(body)});
    toast('Tasting saved.'); location.hash = code ? '#/bottle/' + code : '#/journal';
  } catch (e) { document.getElementById('tmsg').textContent = e.message; btn.disabled = false; btn.textContent = 'Save'; }
}
async function deleteTasting(id){ const ok = await choose('Delete this tasting?', [{label:'Delete it', value:true}]); if (!ok) return; await api('journal/' + id, {method:'DELETE'}); journal(); }
async function deleteWish(id){ await api('wishlist/' + id, {method:'DELETE'}); journal(); }
async function addWish(){ const w = await askText('Add to wish list', 'Producer and wine'); if (!w) return; await api('wishlist', {method:'POST', body: JSON.stringify({wine: w})}); journal(); }

// ---------- Settings ----------
async function settings(){
  const [st, ls] = await Promise.all([api('settings'), api('locations')]);
  topbar('Settings', {back:'#/tonight', noGear:true});
  const large = document.documentElement.dataset.size === 'large';
  view.innerHTML = `
    <div class="card"><label>Text size on this device</label>
      <div class="segs"><button class="${large?'':'on'}" onclick="setSize('normal')">Normal</button><button class="${large?'on':''}" onclick="setSize('large')">Large</button></div>
      <label>Default place for new bottles</label>
      <select id="defLoc">${ls.map(l => `<option value="${l.code}" ${l.code === st.default_location_code ? 'selected' : ''}>${esc(l.name)}${l.holding ? ' (holding place)' : ''}</option>`).join('')}</select>
      <label>Default taster for journal entries</label><input id="defTaster" value="${esc(st.default_taster || '')}" placeholder="Jen">
      <label>Household taste profile (Claude reads this when recommending)</label><textarea id="tasteProfile" rows="8">${esc(st.taste_profile || '')}</textarea>
      <button class="big" onclick="saveSettings()">Save</button></div>
    <h2>Label printer</h2>
    <div class="card" id="printerCard">Checking…</div>
    <p class="sub" style="text-align:center">Stellar Cellar v${APP_VERSION}</p>
    <h2>From the add-on configuration</h2>
    <div class="card sub">Currency ${esc(st.currency)} · Drink soon within ${st.drink_soon_months} months · Price tiers ${money(st.price_tier_low, st.currency)} and ${money(st.price_tier_high, st.currency)}<br>Change these in Home Assistant: Settings → Add-ons → Stellar Cellar → Configuration.</div>`;
  loadPrinterCard();
}
async function loadPrinterCard(){
  const p = await printerInfo(); const el = document.getElementById('printerCard'); if (!el) return;
  el.innerHTML = p.configured ? `<div class="row"><div><div class="title">Zebra at ${esc(p.host)}</div><div class="sub">${p.online ? 'Online' : 'Not answering'} · ${p.label_mm[0]} × ${p.label_mm[1]} mm · ${p.dpi} dpi</div></div><button class="ghost" onclick="testPrint(this)">Test print</button></div>`
    : '<div class="sub">No network printer set. Add the Zebra\'s IP as zebra_host in the add-on configuration and labels will print straight from your phone.</div>';
}
async function testPrint(btn){ await busy(btn, async () => { try { await api('print/test', {method:'POST'}); toast('Test label sent.'); } catch (e) { toast(e.message); } }); }
function setSize(s){ if (s === 'large') { document.documentElement.dataset.size = 'large'; localStorage.setItem('sc_size','large'); } else { delete document.documentElement.dataset.size; localStorage.removeItem('sc_size'); } settings(); }
async function saveSettings(){
  await api('settings', {method:'POST', body: JSON.stringify({default_location_code: document.getElementById('defLoc').value, default_taster: document.getElementById('defTaster').value, taste_profile: document.getElementById('tasteProfile').value})});
  toast('Settings saved.');
}

// ---------- Router ----------
const TAB_FOR = {list:'tonight', tonight:'tonight', cellar:'cellar', bottle:'cellar', edit:'cellar', held:'cellar', gifts:'cellar', location:'cellar', add:'cellar', scan:'scan', journal:'journal', settings:''};
window.__navDepth = 0;
window.addEventListener('hashchange', () => { window.__navDepth++; });
async function route(){
  closeSheet();
  if (!location.hash.startsWith('#/scan')) stopScan();
  const [, page, arg] = location.hash.split('/');
  const tab = TAB_FOR[page] ?? 'tonight';
  document.querySelectorAll('nav a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  window.scrollTo(0, 0);
  try {
    if (page === 'scan') await scan();
    else if (page === 'cellar') await cellar();
    else if (page === 'add') addForm();
    else if (page === 'bottle' && arg) await bottle(arg.toUpperCase());
    else if (page === 'location' && arg) { const parts = location.hash.split('/'); await locationPage(arg.toUpperCase(), parts[3], parts[4] ? parts[4].toUpperCase() : null); }
    else if (page === 'settings') await settings();
    else if (page === 'edit' && arg) await editForm(arg.toUpperCase());
    else if (page === 'held') await heldPage();
    else if (page === 'gifts') await giftsPage();
    else if (page === 'list') await statusList(arg || 'all');
    else if (page === 'journal' && arg === 'new') await journalNew(location.hash.split('/')[3] ? location.hash.split('/')[3].toUpperCase() : null);
    else if (page === 'journal') await journal();
    else await tonight();
  } catch (e) { view.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
